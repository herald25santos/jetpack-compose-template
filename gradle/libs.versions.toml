firebase-database-ktx = { module = "com.google.firebase:firebase-database-ktx", version = "21.0.0" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room-version" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room-version" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room-version" }

dagger-hilt = { module = "com.google.dagger:hilt-android", version.ref = "dagger-version" }
dagger-hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "dagger-version" }

hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-version" }
hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-version" }

okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version = "4.9.3" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit-version" }
