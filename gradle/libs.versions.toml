compose-ui-test-junit4-test = { module = "androidx.compose.ui:ui-test-junit4", version = "1.7.8" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose-ui-version" }
compose-material = { module = "androidx.compose.material:material", version.ref = "compose-ui-version" }
compose-animation = { module = "androidx.compose.animation:animation-android", version.ref = "compose-ui-version" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version = "2.8.9" }
compose-coil = { module = "io.coil-kt:coil-compose", version = "2.2.2" }

accompanist-pager = { module = "com.google.accompanist:accompanist-pager", version.ref = "accompanist-pager-version" }
