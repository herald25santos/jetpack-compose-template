[versions]
kotlin-version = "2.1.20"
compose-ui-version = "1.7.8"
retrofit-version = "2.11.0"
hilt-version = "1.2.0"
dagger-version = "2.51.1"
room-version = "2.7.0"
accompanist-pager-version = "0.28.0"
google-services-version = "4.4.2"
compose-compiler-version = "2.0.20"
gradle-version = "8.9.1"
kotlin-gradle-version = "2.0.20"
ksp-version = "2.0.21-1.0.27"

[plugins]
library = { id = "com.android.library", version.ref = "gradle-version" }
application = { id = "com.android.application", version.ref = "gradle-version" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "compose-compiler-version" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp-version" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-gradle-version" }

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version = "8.9.1" }
google-services-classpath = { module = "com.google.gms:google-services", version.ref = "google-services-version" }
dagger-hilt-classpath = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "dagger-version" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin-version" }

core-ktx = { module = "androidx.core:core-ktx", version = "1.16.0" }
lifecycle-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.8.7" }
compose-activity = { module = "androidx.activity:activity-compose", version = "1.10.1" }

compose-bom = { module = "androidx.compose:compose-bom", version = "2025.04.00" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
