retrofit-adapter-rxjava2 = { module = "com.squareup.retrofit2:adapter-rxjava2", version.ref = "retrofit-version" }

junit-test = { module = "junit:junit", version = "4.13.2" }
ext-junit-test = { module = "androidx.test.ext:junit", version = "1.2.1" }
espresso-core-test = { module = "androidx.test.espresso:espresso-core", version = "3.6.1" }

mockito-kotlin-test = { module = "org.mockito.kotlin:mockito-kotlin", version = "4.1.0" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.7.3" }

[bundles]